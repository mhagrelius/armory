<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d32d"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
  </defs>

  <!-- A shield: the armory's contents, and a tally of what is in it. -->
  <path d="M64 10 108 24v40c0 26-18 44-44 54-26-10-44-28-44-54V24Z"
        fill="url(#rim)"/>
  <path d="M64 19 99 30v34c0 21.5-14.5 36.5-35 45-20.5-8.5-35-23.5-35-45V30Z"
        fill="url(#plate)"/>

  <!-- Three bars: done, in progress, and the one not started. The run, in
       miniature. -->
  <g fill="#ffffff">
    <rect x="42" y="44" width="44" height="9" rx="4.5"/>
    <rect x="42" y="61" width="27" height="9" rx="4.5" opacity="0.72"/>
    <rect x="42" y="78" width="14" height="9" rx="4.5" opacity="0.42"/>
  </g>
</svg>
